    /* Variables y Paleta de Colores Corporativa */
    :root {
      --color-primary: #11212F;
      --color-primary-dark: #0a151f;
      --color-surface: rgba(255, 255, 255, 0.05);
      --color-surface-hover: rgba(255, 255, 255, 0.08);
      --color-border: #23425e;
      --color-secondary: #F7C35A;
      --color-secondary-hover: #e5b34f;
      --color-text: #FFFFFF;
      --color-text-muted: rgba(255, 255, 255, 0.7);
      
      /* Badges de Clasificación */
      --badge-hot-bg: #991b1b;
      --badge-hot-text: #ffffff;
      --badge-warm-bg: #F7C35A;
      --badge-warm-text: #11212F;
      --badge-cold-bg: #93c5fd;
      --badge-cold-text: #0f172a;
      --badge-unqualified-bg: #374151;
      --badge-unqualified-text: #d1d5db;
      
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Reset Global */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-primary);
      color: var(--color-text);
      font-family: var(--font-family);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Cabecera (Header) */
    header {
      background-color: rgba(17, 33, 47, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-content {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background-color: var(--color-secondary);
      color: var(--color-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(247, 195, 90, 0.2);
    }

    .brand-info h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-info span {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      display: block;
    }

    /* Botón Actualizar Datos con SVG Inline */
    .btn-refresh {
      background-color: var(--color-secondary);
      color: var(--color-primary);
      border: none;
      border-radius: 8px;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 700;
      font-family: var(--font-family);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-refresh:hover:not(:disabled) {
      background-color: var(--color-secondary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(247, 195, 90, 0.25);
    }

    .btn-refresh:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-refresh svg {
      width: 16px;
      height: 16px;
      transition: transform 0.4s ease;
    }

    .btn-refresh.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Barra de Métricas y Filtros */
    .dashboard-toolbar {
      padding: 2rem 0 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .stats-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .stat-pill {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      font-size: 0.8125rem;
    }

    .stat-pill .number {
      font-weight: 800;
      color: var(--color-secondary);
      font-variant-numeric: tabular-nums;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .filter-select {
      background-color: var(--color-primary-dark);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      font-family: var(--font-family);
      font-size: 0.8125rem;
      padding: 0.5rem 2rem 0.5rem 0.875rem;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F7C35A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.75rem center;
      background-size: 0.875em;
    }

    .filter-select:focus {
      border-color: var(--color-secondary);
    }

    /* Área Principal de Contenido */
    main {
      flex: 1;
      padding: 1rem 0 3rem;
    }

    /* Tabla de Datos (Data Table) */
    .table-container {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    thead {
      background-color: rgba(10, 21, 31, 0.85);
      border-bottom: 2px solid var(--color-border);
    }

    th {
      padding: 1rem 1.25rem;
      font-weight: 700;
      color: var(--color-text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--color-border);
      transition: background-color 0.15s ease;
    }

    tbody tr:hover {
      background-color: var(--color-surface-hover);
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    td {
      padding: 1.125rem 1.25rem;
      vertical-align: middle;
    }

    /* Columnas Específicas */
    .col-fecha {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .contact-cell .name {
      font-weight: 700;
      color: var(--color-text);
      text-transform: capitalize;
    }

    .contact-cell .email {
      font-size: 0.8125rem;
      color: var(--color-secondary);
      display: block;
      margin-top: 0.15rem;
    }

    .contact-cell .phone {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      display: block;
    }

    .company-cell .company-name {
      font-weight: 600;
      color: var(--color-text);
      text-transform: capitalize;
    }

    .company-cell .industry-badge {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .score-cell {
      white-space: nowrap;
    }

    .score-wrap {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .score-value {
      font-weight: 800;
      font-size: 1rem;
      color: var(--color-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 28px;
    }

    .score-bar-bg {
      width: 50px;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      background-color: var(--color-secondary);
      border-radius: 9999px;
    }

    /* Badges Condicionales de Clasificación */
    .badge {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .badge-hot {
      background-color: var(--badge-hot-bg);
      color: var(--badge-hot-text);
      border: 1px solid #dc2626;
      box-shadow: 0 2px 8px rgba(153, 27, 27, 0.4);
    }

    .badge-warm {
      background-color: var(--badge-warm-bg);
      color: var(--badge-warm-text);
      border: 1px solid #f9d27d;
      box-shadow: 0 2px 8px rgba(247, 195, 90, 0.25);
    }

    .badge-cold {
      background-color: var(--badge-cold-bg);
      color: var(--badge-cold-text);
      border: 1px solid #bfdbfe;
    }

    .badge-unqualified {
      background-color: var(--badge-unqualified-bg);
      color: var(--badge-unqualified-text);
      border: 1px solid #4b5563;
    }

    .action-cell {
      font-size: 0.8125rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.85);
      max-width: 340px;
    }

    /* Estado de Carga (Loading State) */
    .state-row {
      text-align: center;
      padding: 4rem 1.5rem !important;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(247, 195, 90, 0.2);
      border-top-color: var(--color-secondary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    .loading-text {
      color: var(--color-secondary);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Estado de Error o Vacío */
    .empty-error-text {
      color: #fca5a5;
      background-color: rgba(127, 29, 29, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      display: inline-block;
      font-size: 0.875rem;
      max-width: 600px;
      line-height: 1.5;
    }

    /* Footer */
    footer {
      background-color: var(--color-primary-dark);
      border-top: 1px solid var(--color-border);
      padding: 1.5rem 0;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
    }

    /* Responsive Grid de Tarjetas para Dispositivos Móviles */
    @media (max-width: 768px) {
      .header-content {
        height: auto;
        padding: 1rem 0;
        flex-direction: column;
        align-items: stretch;
      }

      .btn-refresh {
        justify-content: center;
      }

      .dashboard-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-group {
        width: 100%;
      }

      .filter-select {
        width: 100%;
      }
    }
  </style>
</head>

      // Formateo de fecha DD/MM/YYYY HH:MM
      function formatDate(isoString) {
        if (!isoString) return '-';
        try {
          const date = new Date(isoString);
          if (isNaN(date.getTime())) return isoString;
          const day = String(date.getDate()).padStart(2, '0');
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const year = date.getFullYear();
          const hours = String(date.getHours()).padStart(2, '0');
          const minutes = String(date.getMinutes()).padStart(2, '0');
          return `${day}/${month}/${year} ${hours}:${minutes}`;
        } catch (e) {
          return isoString;
        }
      }

                <div class="name">${fullName}</div>
                <span class="email">${email}</span>
                ${phone ? `<span class="phone">${phone}</span>` : ''}
              </td>

              <!-- Empresa & Industria -->
              <td class="company-cell">
                <div class="company-name">${company}</div>
                <span class="industry-badge">${industry}</span>
              </td>

              <!-- Score -->
              <td class="score-cell">
                <div class="score-wrap">
                  <span class="score-value">${score}</span>
                  <div class="score-bar-bg" title="Score: ${score}/100">
                    <div class="score-bar-fill" style="width: ${scorePercent}%;"></div>
                  </div>
                </div>
              </td>

              <!-- Clasificación (Badge visual condicional) -->
              <td>
                <span class="badge ${badgeClass}">${clasificacion}</span>
              </td>

              <!-- Acción Recomendada -->
              <td class="action-cell">
                ${accion}
              </td>
            </tr>
          `;
        }).join('');

        leadsBody.innerHTML = rowsHtml;
      }

      // Actualizar contadores
      function updateMetrics(leads) {
        const total = leads.length;
        const hot = leads.filter(l => String(l.clasificacion).toLowerCase() === 'hot').length;
        const warm = leads.filter(l => String(l.clasificacion).toLowerCase() === 'warm').length;

        statTotal.textContent = total;
        statHot.textContent = hot;
        statWarm.textContent = warm;
      }

      // Aplicar filtro de clasificación
      function applyFilter() {
        const filterValue = classificationFilter.value;
        if (filterValue === 'all') {
          renderRows(rawLeads);
        } else {
          const filtered = rawLeads.filter(l => String(l.clasificacion).toLowerCase() === filterValue);
          renderRows(filtered);
        }
      }

      // 2. Función Principal Fetch API (GET)
      async function fetchLeads() {
        // 1 & 5. Vaciar tabla y mostrar loader
        showLoading();

        try {
          let data;

          // Si el endpoint es el ficticio por defecto o un string sin http, simulamos la respuesta de n8n
          if (WEBHOOK_GET_LEADS_URL === 'URL_DEL_WEBHOOK_GET_LEADS_N8N' || !WEBHOOK_GET_LEADS_URL.startsWith('http')) {
            await new Promise(resolve => setTimeout(resolve, 800));
            data = DEMO_LEADS;
          } else {
            const response = await fetch(WEBHOOK_GET_LEADS_URL, {
              method: 'GET',
              headers: {
                'Accept': 'application/json'
              }
            });

            if (!response.ok) {
              throw new Error('Estado HTTP ' + response.status);
            }

            data = await response.json();
          }

          if (!Array.isArray(data) || data.length === 0) {
            showError('No se encontraron leads o hubo un error al conectar con n8n.');
            return;
          }

          rawLeads = data;
          updateMetrics(rawLeads);
          applyFilter();

        } catch (error) {
          // 4. Manejo de error
          showError('No se encontraron leads o hubo un error al conectar con n8n.');
        }
      }

      // 5. Botón Actualizar Datos
      btnRefresh.addEventListener('click', function() {
        fetchLeads();
      });

      // Evento de filtro
      classificationFilter.addEventListener('change', function() {
        applyFilter();
      });

      // Carga inicial al cargar la página
      fetchLeads();
    })();
  </script>
</body>
</html>
